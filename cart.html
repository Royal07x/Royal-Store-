<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>🛒 Shopping Cart</h1>
</header>

<main class="cart-page">

  <h2>🛒 Shopping Cart</h2>

  <!-- STEP 1 -->
  <div class="checkout-box">
    <h3>Step 1 : Your Products</h3>

    <div id="cart-items"></div>

    <hr>

    <p><strong>Total Items:</strong> <span id="cart-count">0</span></p>

    <p><strong>Total Price:</strong> ₹<span id="total-price">0</span></p>
  </div>

  <!-- STEP 2 -->
  <div class="checkout-box">

    <h3>Step 2 : Delivery Details</h3>

    <input type="text" id="name" placeholder="👤 Full Name">

    <input type="tel" id="mobile" placeholder="📱 Mobile Number">

    <textarea id="address" placeholder="🏠 Full Address"></textarea>

    <input type="text" id="city" placeholder="🏙️ City">

    <input type="text" id="pin" placeholder="📮 PIN Code">

  </div>

  <!-- STEP 3 -->
  <div class="checkout-box">

    <h3>Step 3 : Place Order</h3>

    <button id="checkoutBtn" class="whatsapp-btn">
      💬 Place Order on WhatsApp
    </button>

    <button id="clearCartBtn" class="clear-btn">
      🗑️ Clear Cart
    </button>

  </div>

</main>
  
  <!-- LOGIN REQUIRED POPUP -->
<div id="loginModal" class="login-modal">

    <div class="login-modal-box">

        <h2>🔒 Login Required</h2>

        <p>
            Please login or create an account to place your order.
        </p>

        <button id="loginBtnModal" class="modal-btn login-btn">
            Login
        </button>

        <button id="signupBtnModal" class="modal-btn signup-btn">
            Sign Up
        </button>

        <button id="closeModal" class="modal-close">
            Close
        </button>

    </div>

</div>
  
<script src="js/app.js"></script>
  
</body>
</html>
