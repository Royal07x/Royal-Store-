<!DOCTYPE html>
<html lang="en">

<!-- ========================================
     DOCUMENT HEAD
======================================== -->

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Royal Store Secure Account Registration">

    <meta name="theme-color"
          content="#0A0A0A">

    <title>Create Account | Royal Store</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- MAIN CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<!-- ========================================
     SIGNUP PAGE WRAPPER
======================================== -->

<div class="signup-page">

<!-- ========================================
     SIGNUP CARD
======================================== -->

<div class="signup-card">

   <!-- ========================================
         BRAND LOGO
    ========================================= -->

    <div class="signup-logo">

        <i class="fa-solid fa-bag-shopping"></i>

    </div>

    <!-- ========================================
         BRAND TITLE
    ========================================= -->

    <h1 class="signup-title">

        Royal Store

    </h1>

    <p class="signup-subtitle">

        Create Your Account

    </p>

    <!-- ========================================
         SIGNUP FORM
    ========================================= -->

    <form id="signup-form"
          class="signup-form">

        <!-- FULL NAME -->

        <div class="input-group">

            <label for="signup-name">

                Full Name

            </label>

            <input
                type="text"
                id="signup-name"
                placeholder="Enter Your Full Name"
                autocomplete="name"
                required>

        </div>

        <!-- MOBILE NUMBER -->

        <div class="input-group">

            <label for="signup-mobile">

                Mobile Number

            </label>

            <input
                type="tel"
                id="signup-mobile"
                placeholder="Enter Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                required>

        </div>

        <!-- EMAIL ADDRESS -->

        <div class="input-group">

            <label for="signup-email">

                Email Address (Optional)

            </label>

            <input
                type="email"
                id="signup-email"
                placeholder="Enter Email Address"
                autocomplete="email">

        </div>

  <!-- PASSWORD -->

<div class="input-group">

    <label for="signup-password">

        Password

    </label>

    <div class="password-toggle">

        <input
            type="password"
            id="signup-password"
            placeholder="Create Password"
            autocomplete="new-password"
            required>

        <i
            class="fa-solid fa-eye"
            id="toggle-signup-password">
        </i>

    </div>

</div>

<!-- CONFIRM PASSWORD -->

<div class="input-group">

    <label for="confirm-password">

        Confirm Password

    </label>

    <div class="password-toggle">

        <input
            type="password"
            id="confirm-password"
            placeholder="Confirm Password"
            autocomplete="new-password"
            required>

        <i
            class="fa-solid fa-eye"
            id="toggle-confirm-password">
        </i>

    </div>

</div>

<!-- ========================================
     TERMS & CONDITIONS
======================================== -->

<div class="terms-checkbox">

    <label>

        <input
            type="checkbox"
            id="terms-checkbox"
            required>

        I agree to the

        <a href="terms.html">

            Terms & Conditions

        </a>

        and

        <a href="privacy.html">

            Privacy Policy

        </a>

    </label>

</div>

<!-- ========================================
     CREATE ACCOUNT BUTTON
======================================== -->

<button
    type="submit"
    class="signup-btn">

    Create Account

</button>

</form>

<!-- ========================================
     LOGIN LINK
======================================== -->

<div class="login-link">

    <p>

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

</div>

<!-- ========================================
     SOCIAL SIGNUP (FUTURE)
======================================== -->

<div class="social-signup">

    <p>

        Or continue with

    </p>

    <div class="social-icons">

        <button
            class="google-signup"
            disabled>

            <i class="fa-brands fa-google"></i>

        </button>

        <button
            class="facebook-signup"
            disabled>

            <i class="fa-brands fa-facebook-f"></i>

        </button>

        <button
            class="apple-signup"
            disabled>

            <i class="fa-brands fa-apple"></i>

        </button>

    </div>

    <small>

        Coming Soon

    </small>

</div>

<!-- ========================================
     SECURITY BADGE
======================================== -->

<div class="security-badge">

    <i class="fa-solid fa-shield-halved"></i>

    <span>

        Secure Registration & Protected Account

    </span>

</div>

<!-- ========================================
     PRIVACY NOTE
======================================== -->

<div class="privacy-note">

    <p>

        Your information is securely encrypted
        and used only for account creation
        and order processing.

    </p>

</div>

<!-- ========================================
     SIGNUP FOOTER
======================================== -->

<footer class="signup-footer">

    <p>

        © 2026 Royal Store

    </p>

    <p>

        All Rights Reserved

    </p>

</footer>

</div>

<!-- ========================================
     JAVASCRIPT FILES
======================================== -->

<script src="app.js"></script>

<script src="auth.js"></script>

</body>

</html>
