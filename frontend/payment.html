<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><div class="glass about-card"><p class="eyebrow">SECURE PAYMENT</p><h1>Choose payment method</h1><p id="status">Loading order…</p><div id="actions" style="display:grid;gap:14px;max-width:520px"></div></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
if(!isLoggedIn())location.href='./auth.html?next=./payment.html';
const id=new URLSearchParams(location.search).get('order');const status=document.querySelector('#status'),actions=document.querySelector('#actions');
if(!id){status.textContent='Missing order.';}else{actions.innerHTML='<button class="primary-button" id="qr">Generate secure UPI QR <span>→</span></button><button class="secondary-button" id="gateway">Start Razorpay payment</button>';document.querySelector('#qr').onclick=async()=>{const r=await authFetch(`/api/payments/orders/${encodeURIComponent(id)}/qr`,{method:'POST'});const p=await r.json();if(!r.ok){status.textContent=p.message||'Could not create QR.';return;}status.textContent='QR created. Open the QR image from the payment response in the next UI step.';console.log('Payment QR URL received from server:',p.data.payment.qrImageUrl);};document.querySelector('#gateway').onclick=async()=>{const r=await authFetch(`/api/payments/orders/${encodeURIComponent(id)}/create`,{method:'POST'});const p=await r.json();status.textContent=r.ok?'Razorpay payment order created. Gateway UI integration is the next payment step.':(p.message||'Could not create payment order.');};}
</script></body></html>
