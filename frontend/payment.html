<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secure Royal Store V2 payment."><title>Secure Payment | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><div class="glass about-card"><p class="eyebrow">ROYAL STORE • SECURE PAYMENT</p><h1>Choose payment method</h1><p id="status">Preparing secure payment…</p><div style="display:grid;gap:12px;max-width:520px"><button class="primary-button" id="gateway" type="button">Pay with Razorpay <span>→</span></button><button class="secondary-button" id="qr" type="button">Pay with UPI QR</button></div><div id="qr-box" hidden style="margin-top:20px;text-align:center"><img id="qr-image" alt="Secure UPI payment QR code" width="280" height="280" style="max-width:100%;border-radius:18px;background:#fff;padding:12px"><p id="qr-countdown"></p><button class="secondary-button" id="check-qr" type="button">Check QR payment</button></div></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
const orderId=new URLSearchParams(location.search).get('order'),status=document.querySelector('#status'),gateway=document.querySelector('#gateway'),qr=document.querySelector('#qr'),qrBox=document.querySelector('#qr-box'),qrImage=document.querySelector('#qr-image'),countdown=document.querySelector('#qr-countdown'),checkQr=document.querySelector('#check-qr');let qrPaymentId=null,qrCloseAt=0,qrTimer=null,checking=false;
if(!isLoggedIn()){location.href=`./auth.html?next=${encodeURIComponent(`./payment.html?order=${orderId||''}`)}`;throw new Error('Authentication required');}if(!orderId){status.textContent='Missing order ID.';gateway.disabled=true;qr.disabled=true;}
const json=async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.message||'Payment request failed.');return p.data;};
const loadRazorpay=()=>new Promise((resolve,reject)=>{if(window.Razorpay){resolve();return;}const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=()=>resolve();s.onerror=()=>reject(new Error('Unable to load secure payment gateway.'));document.head.appendChild(s);});
const verify=async(response,paymentAttemptId)=>{status.textContent='Verifying payment securely…';const data=await json(await authFetch('/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:paymentAttemptId,razorpayOrderId:response.razorpay_order_id,razorpayPaymentId:response.razorpay_payment_id,razorpaySignature:response.razorpay_signature})}));if(data.payment.status!=='paid')throw new Error('Payment is not confirmed yet.');status.textContent='Payment confirmed successfully.';location.href=`./orders.html?order=${encodeURIComponent(orderId)}`;};
gateway.onclick=async()=>{gateway.disabled=true;status.textContent='Creating secure Razorpay order…';try{await loadRazorpay();const data=await json(await authFetch(`/api/payments/orders/${encodeURIComponent(orderId)}/create`,{method:'POST'}));const attemptId=data.payment.id;const options={key:data.razorpayKeyId,amount:data.payment.amount,currency:data.payment.currency||'INR',name:'Royal Store V2',description:'Royal Store order payment',order_id:data.payment.gatewayOrderId,handler:async response=>{try{await verify(response,attemptId);}catch(e){status.textContent=e.message;gateway.disabled=false;}},modal:{ondismiss:()=>{status.textContent='Payment window closed. You can retry.';gateway.disabled=false;}}};new window.Razorpay(options).open();}catch(e){status.textContent=e.message;gateway.disabled=false;}};
const updateCountdown=()=>{const left=Math.max(0,qrCloseAt-Date.now());if(!qrCloseAt){countdown.textContent='';return;}if(!left){countdown.textContent='QR expired. Generate a new QR to retry.';qr.disabled=false;clearInterval(qrTimer);return;}countdown.textContent=`QR expires in ${Math.ceil(left/1000)} seconds.`;};
const pollQr=async()=>{if(!qrPaymentId||checking)return;checking=true;try{const data=await json(await authFetch(`/api/payments/${encodeURIComponent(qrPaymentId)}`));const p=data.payment;if(p.status==='paid'){status.textContent='Payment confirmed successfully.';clearInterval(qrTimer);location.href=`./orders.html?order=${encodeURIComponent(orderId)}`;}else if(p.status==='expired'||p.status==='failed'){status.textContent=`QR payment ${p.status}. Generate a new QR to retry.`;qr.disabled=false;clearInterval(qrTimer);}}catch(e){status.textContent=e.message;}finally{checking=false;}};
qr.onclick=async()=>{qr.disabled=true;status.textContent='Generating a fresh single-use QR…';try{const data=await json(await authFetch(`/api/payments/orders/${encodeURIComponent(orderId)}/qr`,{method:'POST'}));const p=data.payment;qrPaymentId=p.id;qrCloseAt=p.qrCloseBy?new Date(p.qrCloseBy).getTime():Date.now()+120000;qrImage.src=p.qrImageUrl;qrBox.hidden=false;status.textContent='Scan the QR with your UPI app. Payment confirmation comes from the server.';clearInterval(qrTimer);qrTimer=setInterval(()=>{updateCountdown();pollQr();},3000);updateCountdown();}catch(e){status.textContent=e.message;qr.disabled=false;}};checkQr.onclick=pollQr;
</script></body></html>
