<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><div class="glass about-card"><p class="eyebrow">SECURE CHECKOUT</p><h1>Delivery details</h1><p>Your account is required for checkout. Payment will be handled separately by the verified server-side payment flow.</p><form id="checkout-form" style="display:grid;gap:14px;max-width:620px"><input name="fullName" placeholder="Full name" autocomplete="name" required maxlength="100"><input name="phone" placeholder="Phone" autocomplete="tel" required maxlength="20"><input name="line1" placeholder="Address" autocomplete="street-address" required maxlength="200"><input name="city" placeholder="City" autocomplete="address-level2" required maxlength="80"><input name="state" placeholder="State" autocomplete="address-level1" required maxlength="80"><input name="postalCode" placeholder="PIN code" autocomplete="postal-code" required maxlength="10"><button class="primary-button" type="submit">Create order <span>→</span></button><p id="message" role="alert"></p></form></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
if(!isLoggedIn())location.href='./auth.html?next=./checkout.html';
const form=document.querySelector('#checkout-form'),msg=document.querySelector('#message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const shippingAddress=Object.fromEntries(new FormData(form));const r=await authFetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shippingAddress})});const p=await r.json();if(!r.ok){msg.textContent=p.message||'Unable to create order.';return;}msg.textContent='Order created. Payment step will be connected next.';form.reset();});
</script></body></html>
