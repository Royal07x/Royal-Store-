<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reset your Royal Store V2 account password.">
  <title>Forgot Password | Royal Store V2</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>.auth-shell{max-width:520px;margin:8vh auto;padding:24px}.auth-card{padding:32px}.auth-form{display:grid;gap:14px}.auth-form label{font-weight:600}.auth-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid rgba(0,0,0,.12);border-radius:14px;background:#fff}.auth-message{min-height:24px;color:var(--muted)}</style>
</head>
<body><main class="auth-shell"><section class="auth-card glass">
  <a class="brand" href="./index.html"><span class="brand-mark">R</span><span><strong>ROYAL</strong><small>STORE V2</small></span></a>
  <p class="eyebrow">ACCOUNT SECURITY</p><h1 style="font-size:clamp(2.5rem,8vw,4.5rem)">Forgot password?</h1>
  <p>Enter your account email. If it matches an active account, reset instructions will be sent.</p>
  <form class="auth-form" id="forgot-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><button class="primary-button" id="submit" type="submit">Send reset link <span>→</span></button><p class="auth-message" id="message" role="alert"></p></form>
  <p><a href="./auth.html">← Back to login</a></p>
</section></main>
<script type="module">
const API_BASE=(window.ROYAL_STORE_API_BASE||'').replace(/\/$/,'');const form=document.querySelector('#forgot-form'),button=document.querySelector('#submit'),message=document.querySelector('#message');
form.addEventListener('submit',async(e)=>{e.preventDefault();message.textContent='';button.disabled=true;try{const response=await fetch(`${API_BASE}/api/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value})});const payload=await response.json();if(!response.ok)throw new Error(payload.message||'Request failed.');message.textContent=payload.message;}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
