<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><div class="glass about-card"><p class="eyebrow">ORDER STATUS</p><h1 id="title">Loading…</h1><div id="details">Please wait.</div><a class="primary-button" href="./shop.html">Continue shopping <span>→</span></a></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
if(!isLoggedIn())location.href=`./auth.html?next=${encodeURIComponent('./orders.html')}`;
const id=new URLSearchParams(location.search).get('order');const title=document.querySelector('#title'),details=document.querySelector('#details');
if(!id){title.textContent='Order not found';details.textContent='No order ID was provided.';}else{try{const r=await authFetch(`/api/orders/${encodeURIComponent(id)}`),p=await r.json();if(!r.ok)throw new Error(p.message||'Could not load order.');const o=p.data.order;title.textContent=`Order ${o.orderNumber}`;details.innerHTML=`<p>Status: <strong>${o.status}</strong></p><p>Payment: <strong>${o.paymentStatus}</strong></p><p>Total: <strong>₹${Number(o.total).toLocaleString('en-IN')}</strong></p>`;}catch(e){title.textContent='Unable to load order';details.textContent=e.message;}}
</script></body></html>
