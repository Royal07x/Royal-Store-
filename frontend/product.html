<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Royal Store V2 product details."><title>Product | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section reveal" style="padding-top:8vh"><a class="secondary-button" href="./shop.html">← Back to shop</a><div id="product-detail" class="glass about-card" style="margin-top:24px"><p class="eyebrow">PRODUCT</p><h1>Loading product…</h1></div><section id="reviews-section" class="glass about-card" style="margin-top:24px"><p class="eyebrow">CUSTOMER REVIEWS</p><h2 id="rating-summary">Reviews</h2><div id="reviews-list" aria-live="polite">Loading reviews…</div><form id="review-form" hidden style="display:grid;gap:12px;margin-top:20px;max-width:620px"><label>Rating <select name="rating" required><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select></label><textarea name="comment" placeholder="Write your review" maxlength="1000" minlength="3" required></textarea><input name="orderId" placeholder="Delivered order ID" required><button class="primary-button" type="submit">Submit review <span>→</span></button><p id="review-message" role="alert"></p></form></section></section></main><script type="module">
import { loadProduct, getProductFromUrl } from './js/catalog-ui.js';import { authFetch, isLoggedIn } from './js/auth.js';
const root=document.querySelector('#product-detail'),reviewsList=document.querySelector('#reviews-list'),summary=document.querySelector('#rating-summary'),form=document.querySelector('#review-form'),reviewMessage=document.querySelector('#review-message');const id=getProductFromUrl();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loadReviews=async()=>{if(!id)return;try{const r=await fetch(`${(window.ROYAL_STORE_API_BASE||'').replace(/\/$/,'')}/reviews/product/${encodeURIComponent(id)}`),p=await r.json();if(!r.ok)throw Error(p.message||'Unable to load reviews.');const reviews=p.reviews||[];const avg=reviews.length?reviews.reduce((s,x)=>s+Number(x.rating),0)/reviews.length:0;summary.textContent=reviews.length?`${avg.toFixed(1)} / 5 · ${reviews.length} review${reviews.length===1?'':'s'}`:'No approved reviews yet';reviewsList.replaceChildren(...(reviews.length?reviews.map(x=>{const el=document.createElement('article');el.className='glass';el.style.cssText='margin:12px 0;padding:16px';el.innerHTML=`<strong>${'★'.repeat(Number(x.rating))}${'☆'.repeat(5-Number(x.rating))}</strong><p>${esc(x.comment)}</p><small>${esc(x.userName)}</small>`;return el;}):[Object.assign(document.createElement('p'),{textContent:'Be the first customer to review this product.'})]));}catch(e){reviewsList.textContent=e.message;}};
const product=await loadProduct(id);if(!product){root.innerHTML='<p class="eyebrow">PRODUCT</p><h1>Product not found</h1><a class="primary-button" href="./shop.html">Back to shop <span>→</span></a>';}else{const pid=product._id||product.id;root.innerHTML=`<p class="eyebrow">${esc(product.category||'ROYAL STORE')}</p><h1>${esc(product.name)}</h1><p>${esc(product.description)}</p><h2>₹${Number(product.price).toLocaleString('en-IN')}</h2><p>Stock: ${Number(product.stock??0)}</p><button class="primary-button" id="buy-now" type="button">Buy Now <span>→</span></button><button class="secondary-button" id="add-cart" type="button" style="margin-left:8px">Add to cart</button><p id="product-message" role="alert"></p>`;const message=document.querySelector('#product-message');const addToCart=async()=>{if(!isLoggedIn()){location.href=`./auth.html?next=${encodeURIComponent(`./product.html?id=${pid}&buyNow=1`)}`;return false;}const r=await authFetch('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:pid,quantity:1})});const p=await r.json();if(!r.ok){message.textContent=p.message||'Unable to add product to cart.';return false;}return true;};document.querySelector('#add-cart').onclick=async()=>{if(await addToCart())message.textContent='Added to cart.';};document.querySelector('#buy-now').onclick=async()=>{if(await addToCart())location.href='./checkout.html';};if(new URLSearchParams(location.search).get('buyNow')==='1'&&isLoggedIn()){if(await addToCart())location.href='./checkout.html';}}
if(isLoggedIn())form.hidden=false;await loadReviews();form.addEventListener('submit',async e=>{e.preventDefault();reviewMessage.textContent='Submitting…';const data=Object.fromEntries(new FormData(form));const r=await authFetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,orderId:data.orderId,rating:Number(data.rating),comment:data.comment})});const p=await r.json();reviewMessage.textContent=r.ok?'Review submitted for moderation.':(p.message||'Unable to submit review.');if(r.ok){form.reset();await loadReviews();}});
</script></body></html>
