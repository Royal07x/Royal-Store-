<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Royal Store V2 product details."><title>Product | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section reveal" style="padding-top:8vh"><a class="secondary-button" href="./shop.html">← Back to shop</a><div id="product-detail" class="glass about-card" style="margin-top:24px"><p class="eyebrow">PRODUCT</p><h1>Loading product…</h1></div></section></main><script type="module">
import { loadProduct, getProductFromUrl } from './js/catalog-ui.js';import { authFetch, isLoggedIn } from './js/auth.js';
const root=document.querySelector('#product-detail');const id=getProductFromUrl();const product=await loadProduct(id);const params=new URLSearchParams(location.search);const buyNow=params.get('buyNow')==='1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!product){root.innerHTML='<p class="eyebrow">PRODUCT</p><h1>Product not found</h1><a class="primary-button" href="./shop.html">Back to shop <span>→</span></a>';}else{const pid=product._id||product.id;root.innerHTML=`<p class="eyebrow">${esc(product.category||'ROYAL STORE')}</p><h1>${esc(product.name)}</h1><p>${esc(product.description)}</p><h2>₹${Number(product.price).toLocaleString('en-IN')}</h2><p>Stock: ${Number(product.stock??0)}</p><button class="primary-button" id="buy-now" type="button">Buy Now <span>→</span></button><button class="secondary-button" id="add-cart" type="button" style="margin-left:8px">Add to cart</button><p id="product-message" role="alert"></p>`;const message=document.querySelector('#product-message');const addToCart=async()=>{if(!isLoggedIn()){location.href=`./auth.html?next=${encodeURIComponent(`./product.html?id=${pid}&buyNow=1`)}`;return false;}const r=await authFetch('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:pid,quantity:1})});const p=await r.json();if(!r.ok){message.textContent=p.message||'Unable to add product to cart.';return false;}return true;};document.querySelector('#add-cart').onclick=async()=>{if(await addToCart())message.textContent='Added to cart.';};document.querySelector('#buy-now').onclick=async()=>{if(await addToCart())location.href='./checkout.html';};if(buyNow&&isLoggedIn()){if(await addToCart())location.href='./checkout.html';}}
</script></body></html>
