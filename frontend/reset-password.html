<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Set a new Royal Store V2 account password.">
  <title>Reset Password | Royal Store V2</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>.auth-shell{max-width:520px;margin:8vh auto;padding:24px}.auth-card{padding:32px}.auth-form{display:grid;gap:14px}.auth-form label{font-weight:600}.auth-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid rgba(0,0,0,.12);border-radius:14px;background:#fff}.auth-message{min-height:24px;color:var(--muted)}</style>
</head>
<body><main class="auth-shell"><section class="auth-card glass">
  <a class="brand" href="./index.html"><span class="brand-mark">R</span><span><strong>ROYAL</strong><small>STORE V2</small></span></a>
  <p class="eyebrow">ACCOUNT SECURITY</p><h1 style="font-size:clamp(2.5rem,8vw,4.5rem)">Set new password</h1>
  <p>Choose a new password with at least 8 characters. Reset links are single-use and expire after 15 minutes.</p>
  <form class="auth-form" id="reset-form"><label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="primary-button" id="submit" type="submit">Reset password <span>→</span></button><p class="auth-message" id="message" role="alert"></p></form>
  <p><a href="./auth.html">← Back to login</a></p>
</section></main>
<script type="module">
const API_BASE=(window.ROYAL_STORE_API_BASE||'').replace(/\/$/,'');const form=document.querySelector('#reset-form'),button=document.querySelector('#submit'),message=document.querySelector('#message');const token=new URLSearchParams(location.hash.slice(1)).get('token');
if(!token){button.disabled=true;message.textContent='This reset link is missing or invalid.';}
form.addEventListener('submit',async(e)=>{e.preventDefault();message.textContent='';if(document.querySelector('#password').value!==document.querySelector('#confirm').value){message.textContent='Passwords do not match.';return;}button.disabled=true;try{const response=await fetch(`${API_BASE}/api/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({token,password:document.querySelector('#password').value})});const payload=await response.json();if(!response.ok)throw new Error(payload.message||'Password reset failed.');message.textContent=payload.message;form.reset();location.hash='';}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
