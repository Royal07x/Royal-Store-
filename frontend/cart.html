<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><a class="secondary-button" href="./shop.html">← Continue shopping</a><div class="glass about-card" style="margin-top:24px"><p class="eyebrow">YOUR CART</p><h1>Shopping Cart</h1><div id="cart-items">Loading…</div><div id="cart-summary"></div></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';const itemsEl=document.querySelector('#cart-items'),summary=document.querySelector('#cart-summary');if(!isLoggedIn()){location.href=`./auth.html?next=${encodeURIComponent('./cart.html')}`;throw new Error('Authentication required');}const money=n=>`₹${Number(n).toLocaleString('en-IN')}`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await authFetch('/api/cart');if(!r.ok){itemsEl.textContent='Unable to load cart.';return;}const p=await r.json(),items=p.data.cart.items||[];if(!items.length){itemsEl.innerHTML='<p>Your cart is empty.</p>';summary.innerHTML='<a class="primary-button" href="./shop.html">Browse products <span>→</span></a>';return;}itemsEl.innerHTML=items.map(i=>{const pid=i.product?._id||i.product;return `<div class="glass" style="padding:16px;margin:12px 0"><strong>${esc(i.product?.name||'Product')}</strong><p>${money(i.product?.price||0)} × ${Number(i.quantity)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary-button" data-minus="${esc(pid)}" type="button">−</button><button class="secondary-button" data-plus="${esc(pid)}" type="button">+</button><button class="secondary-button" data-remove="${esc(pid)}" type="button">Remove</button></div></div>`;}).join('');let total=items.reduce((s,i)=>s+(Number(i.product?.price)||0)*Number(i.quantity),0);summary.innerHTML=`<p>Displayed subtotal only; final price is recalculated by the server.</p><h2>Total: ${money(total)}</h2><button class="primary-button" id="checkout" type="button">Proceed to checkout <span>→</span></button>`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{await authFetch('/api/cart/items/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});load();});document.querySelectorAll('[data-plus],[data-minus]').forEach(b=>b.onclick=async()=>{const item=items.find(i=>String(i.product?._id||i.product)===b.dataset.plus||String(i.product?._id||i.product)===b.dataset.minus);if(!item)return;const next=Math.max(0,Number(item.quantity)+(b.dataset.plus?1:-1));if(next===0)await authFetch('/api/cart/items/'+encodeURIComponent(b.dataset.minus),{method:'DELETE'});else await authFetch('/api/cart/items/'+encodeURIComponent(b.dataset.plus),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:next})});load();});document.querySelector('#checkout').onclick=()=>location.href='./checkout.html';}load();
</script></body></html>
