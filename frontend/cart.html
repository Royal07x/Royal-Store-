<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><a class="secondary-button" href="./shop.html">← Continue shopping</a><div class="glass about-card" style="margin-top:24px"><p class="eyebrow">YOUR CART</p><h1>Shopping Cart</h1><div id="cart-items">Loading…</div><div id="cart-summary"></div></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
const itemsEl=document.querySelector('#cart-items'),summary=document.querySelector('#cart-summary');
if(!isLoggedIn()){location.href='./auth.html?next=./cart.html';}
const money=n=>`₹${Number(n).toLocaleString('en-IN')}`;
async function load(){const r=await authFetch('/api/cart');if(!r.ok){itemsEl.textContent='Unable to load cart.';return;}const p=await r.json(),items=p.data.cart.items||[];if(!items.length){itemsEl.innerHTML='<p>Your cart is empty.</p>';summary.innerHTML='<a class="primary-button" href="./shop.html">Browse products <span>→</span></a>';return;}itemsEl.innerHTML=items.map(i=>`<div class="glass" style="padding:16px;margin:12px 0"><strong>${i.product?.name||'Product'}</strong><p>${money(i.product?.price||0)} × ${i.quantity}</p><button class="secondary-button" data-remove="${i.product?._id||i.product}">Remove</button></div>`).join('');let total=items.reduce((s,i)=>s+(i.product?.price||0)*i.quantity,0);summary.innerHTML=`<h2>Total: ${money(total)}</h2><button class="primary-button" id="checkout">Proceed to checkout <span>→</span></button>`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{await authFetch('/api/cart/items/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});load();});document.querySelector('#checkout').onclick=()=>location.href='./checkout.html';}load();
</script></body></html>
