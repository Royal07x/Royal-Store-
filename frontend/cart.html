<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Royal Store V2</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="page-shell"><section class="section" style="padding-top:8vh"><a class="secondary-button" href="./shop.html">← Continue shopping</a><div class="glass about-card" style="margin-top:24px"><p class="eyebrow">YOUR CART</p><h1>Shopping Cart</h1><div id="cart-items">Loading…</div><div id="cart-summary"></div><p id="cart-message" role="alert" aria-live="polite"></p></div></section></main><script type="module">
import {authFetch,isLoggedIn} from './js/auth.js';
const itemsEl=document.querySelector('#cart-items'),summary=document.querySelector('#cart-summary'),message=document.querySelector('#cart-message');
if(!isLoggedIn()){location.href='./auth.html?next='+encodeURIComponent('./cart.html');throw new Error('Authentication required');}
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setMessage=value=>{message.textContent=value||'';};
async function load(){
  setMessage('');
  const r=await authFetch('/api/cart');
  if(!r.ok){itemsEl.textContent='Unable to load cart.';setMessage('Please refresh and try again.');return;}
  const p=await r.json(),items=p.data?.cart?.items||[];
  if(!items.length){itemsEl.innerHTML='<p>Your cart is empty.</p>';summary.innerHTML='<a class="primary-button" href="./shop.html">Browse products <span>→</span></a>';return;}
  itemsEl.innerHTML=items.map(i=>{
    const pid=i.product?._id||i.product,stock=Number(i.product?.stock??0),qty=Number(i.quantity);
    return '<div class="glass" style="padding:16px;margin:12px 0"><strong>'+esc(i.product?.name||'Product')+'</strong><p>'+money(i.product?.price||0)+' × '+qty+' = <strong>'+money((Number(i.product?.price)||0)*qty)+'</strong></p><small>'+(stock>0?'Stock available: '+stock:'Currently unavailable')+'</small><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="secondary-button" data-minus="'+esc(pid)+'" type="button">−</button><button class="secondary-button" data-plus="'+esc(pid)+'" type="button" '+(qty>=stock?'disabled':'')+'>+</button><button class="secondary-button" data-remove="'+esc(pid)+'" type="button">Remove</button></div></div>';
  }).join('');
  const subtotal=items.reduce((s,i)=>s+(Number(i.product?.price)||0)*Number(i.quantity),0),shipping=subtotal>=999?0:49;
  summary.innerHTML='<div class="glass" style="padding:18px;margin-top:18px"><p>Estimated subtotal: <strong>'+money(subtotal)+'</strong></p><p>Estimated delivery: <strong>'+money(shipping)+'</strong></p><p><small>Final subtotal, stock, coupon discount and shipping are recalculated securely by the server at checkout.</small></p><h2>Estimated total: '+money(subtotal+shipping)+'</h2><button class="primary-button" id="checkout" type="button">Proceed to checkout <span>→</span></button></div>';
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{
    const r=await authFetch('/api/cart/items/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});
    if(!r.ok){setMessage('Could not remove that item.');return;} load();
  });
  document.querySelectorAll('[data-plus],[data-minus]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.plus||b.dataset.minus,item=items.find(i=>String(i.product?._id||i.product)===id);
    if(!item)return;
    const next=Math.max(0,Number(item.quantity)+(b.dataset.plus?1:-1));
    const r=next===0?await authFetch('/api/cart/items/'+encodeURIComponent(id),{method:'DELETE'}):await authFetch('/api/cart/items/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:next})});
    if(!r.ok){const d=await r.json().catch(()=>({}));setMessage(d.message||'Could not update cart.');return;} load();
  });
  document.querySelector('#checkout').onclick=()=>location.href='./checkout.html';
}
load();
</script></body></html>
