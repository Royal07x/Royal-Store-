body{
margin:0;
background:#f5f5f7;
font-family:-apple-system,BlinkMacSystemFont,
"SF Pro Display","Segoe UI",sans-serif;
}

.header{
background:#000;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:700;
position:sticky;
top:0;
z-index:999;
}

.back-btn{
display:inline-block;
margin:18px;
padding:12px 18px;
background:#007AFF;
color:#fff;
text-decoration:none;
border-radius:14px;
font-weight:600;
}

.search-box{
padding:0 18px 20px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:16px;
box-sizing:border-box;
background:#fff;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:18px;
padding:18px;
}

.product{
background:#fff;
border-radius:20px;
padding:14px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
text-align:center;
}

.product img{
width:100%;
border-radius:16px;
}

.product h3{
margin:10px 0 5px;
font-size:17px;
}

.price{
font-size:18px;
font-weight:bold;
color:#007AFF;
margin-bottom:10px;
}

</style>

</head>

<script>

const searchInput=document.querySelector(".search-box input");

searchInput.addEventListener("keyup",function(){

let value=this.value.toLowerCase();

document.querySelectorAll(".product").forEach(card=>{

let text=card.innerText.toLowerCase();

card.style.display=text.includes(value)?"block":"none";

});

});

</script>
